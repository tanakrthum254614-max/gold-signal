  <g fill="url(#bar)">
    <rect x="22" y="58" width="9" height="14" rx="1.5"/>
    <rect x="34" y="49" width="9" height="23" rx="1.5"/>
    <rect x="67" y="40" width="9" height="32" rx="1.5"/>
  </g>
  <path d="M60 16 L33 53 H48 L41 84 L70 45 H55 L63 16 Z" fill="url(#bolt)" stroke="#151a23" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>

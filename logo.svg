<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gold Signal mark: a gold hexagon badge, three rising gold bars (price / signal strength) and a lightning strike -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/><stop offset=".35" stop-color="#f0b429"/><stop offset=".7" stop-color="#b9800c"/><stop offset="1" stop-color="#f6d47a"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#2a2414"/><stop offset=".6" stop-color="#151a23"/><stop offset="1" stop-color="#0d1016"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b9800c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f0b429"/>

name: Weekly summary

on:
  # 00:30 UTC Saturday = 07:30 Thai time, after the market closes (03:00 Saturday Thai time)
  schedule:
    - cron: "30 0 * * 6"
  workflow_dispatch:
    inputs:
      send:
        description: "Send to LINE"
        type: boolean
        default: false
      week_of:
        description: "Report a past week: a time in it, e.g. 2026-10-17T07:30:00+07:00 (empty = now)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Saturday LINE summary of Mon–Fri: off 9–19 Oct 2026, back on 19 Oct (user: "ไม่เห็นสรุปของวันเสาร์เลย ที่จะสรุป
      # ตั้งแต่จันถึงศุกร์ ว่าเป็นยังไงสัปดาห์นี้" · "เอาแบบเดิมกลับมา"). Scheduled runs send; manual runs only with send = true.
      SEND: ${{ github.event_name == 'schedule' || inputs.send == true }}
      # manual runs (a past week, a resend) don't score / save anything again
      RECORD: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      WEEKLY_AT: ${{ inputs.week_of || '' }}
      STATE_DIR: state
      SPREAD_USD: ${{ vars.SPREAD_USD || '0.4' }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      # Web push to the app (scripts/push.js) — skipped while these are empty
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      SITE_URL: https://gold-signal-ten.vercel.app
    steps:
      - uses: actions/checkout@v4
      # Signal data lives on the data branch (scripts/data-branch.sh) so these commits don't redeploy the website
      - name: Load signal data
        run: source scripts/data-branch.sh && data_load
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web-push
        run: npm install --omit=dev --no-audit --no-fund --no-package-lock
      - run: pip install -r requirements.txt
      - name: Fetch candles
        run: python scripts/fetch_data.py data.json --m15-only
      - name: Weekly report
        run: node scripts/weekly.js data.json
      - name: Save results
        if: github.event_name == 'schedule'
        run: |
          git config user.name "tanakrthum254614-max"
          git config user.email "$(gh api users/tanakrthum254614-max --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
          source scripts/data-branch.sh
          data_save "Weekly summary $(TZ=Asia/Bangkok date +%F)"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tell the owner if this failed
        if: failure()
        run: node scripts/notify-failure.js "สรุปผลรายสัปดาห์"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

name: Guru filings (live)

on:
  # every 10 minutes (user, 16 Oct 2026: "ขอทุกอย่างแบบเรียลไทม์"): the gurus' new SEC filings — Form 4 buys / sells,
  # 13D / 13G stakes — and a new quarterly 13F rebuilds the portfolios right away (not only at the 06:00 refresh)
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gurus-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web-push (guru trade alerts)
        run: npm install --omit=dev --no-audit --no-fund --no-package-lock
      - name: Check the gurus' latest SEC filings + ARK daily trades, save to the data branch, alert
        env:
          GH_TOKEN: ${{ github.token }}
          # web push to members' devices (scripts/push.js) — skipped while these are empty
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          SITE_URL: https://gold-signal-ten.vercel.app
        run: bash scripts/gurus-live.sh

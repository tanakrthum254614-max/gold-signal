name: Monthly indicator study

# 2nd of every month, 03:00 Thai time (20:00 UTC on the 1st): downloads fresh prices (Binance PAXG), re-runs the 28-indicator study on every
# chart timeframe (research/indicators), commits research/indicators/monthly/<YYYY-MM>.txt and tells the admins whether
# the confirmation indicators in use still help. A report only — the signal rules change only when the owner approves.
# Takes ~1 hour (the 5-minute timeframe is the slow one). Free for a public repository.
on:
  schedule:
    - cron: "0 20 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-research
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATA_DIR: /tmp/indicators
      SEND: "true"
      SITE_URL: https://gold-signal-ten.vercel.app
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_OWNER_ID: ${{ secrets.LINE_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev --no-audit --no-fund --no-package-lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download US news history (for the timeframes that skip news)
        run: python research/indicators/fetch_news.py
        continue-on-error: true
      - name: Download prices
        run: node research/indicators/fetch.js
      - name: Run the study (all timeframes)
        run: node --max-old-space-size=4096 research/indicators/indlab.js .
      - name: Write the monthly report
        run: node research/indicators/monthly.js .
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/indicators/monthly test-stats.json
          git commit -m "Monthly indicator study $(date -u +%Y-%m)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Tell the admins
        run: node scripts/admin-notify.js "$DATA_DIR/short.txt"

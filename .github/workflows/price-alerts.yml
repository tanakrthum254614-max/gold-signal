name: Price alerts + 30-minute signals

on:
  # Every 5 minutes Mon–Fri (UTC) = Mon 07:00 – Sat 06:59 Thai time, covering every signal's window.
  # GitHub may start scheduled runs a few minutes late.
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
    inputs:
      send:
        description: "Send alerts to LINE / Telegram"
        type: boolean
        default: false

permissions:
  contents: write

# Shares a lock with the morning job so the two never write signals.json at the same time
concurrency:
  group: signals-file
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEND: ${{ github.event_name == 'schedule' || inputs.send }}
      RECORD: "true"
      STATE_DIR: state
      SPREAD_USD: ${{ vars.SPREAD_USD || '0.4' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      SITE_URL: https://gold-signal-ten.vercel.app
    steps:
      - uses: actions/checkout@v4
      # What was already announced (hourly update, news warnings, failure notices) — restored first so
      # the failure notice can throttle itself even when an early step fails
      - name: Restore notify state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: notify-${{ github.run_id }}
          restore-keys: notify-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Fetch 15m / 30m / 1h / 5h candles + news calendar
        run: python scripts/fetch_data.py data.json --m15-only
      - name: Check signals, hourly update, news warnings, alerts
        run: |
          node scripts/alerts.js data.json
          node scripts/intraday-run.js data.json
      - name: Save results
        # Commit as the repo owner's GitHub identity: Vercel (Hobby) only deploys commits from linked accounts
        run: |
          git add signals.json intraday.json
          git diff --cached --quiet && exit 0
          git config user.name "tanakrthum254614-max"
          git config user.email "$(gh api users/tanakrthum254614-max --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
          git commit -m "Signal update $(TZ=Asia/Bangkok date '+%F %H:%M')"
          git pull --rebase -q && git push
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tell the owner if this failed
        if: failure()
        run: node scripts/notify-failure.js "เช็กราคา / สัญญาณ 30 นาที (ทุก 5 นาที)"
        env:
          SEND: "true"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Save notify state
        if: always() && hashFiles('state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: notify-${{ github.run_id }}-${{ github.run_attempt }}

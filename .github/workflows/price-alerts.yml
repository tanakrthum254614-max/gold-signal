name: Price alerts + 30-minute signals

on:
  # Mon–Fri (UTC) = Mon 07:00 – Sat 06:59 Thai time. GitHub starts scheduled runs late and irregularly
  # (often 10–20 minutes apart), so each run stays up ~28 minutes and checks at every 5-minute mark
  # itself (scripts/check-loop.sh). A run is queued every 15 minutes: the next one starts as soon as the
  # current one ends, so there is no gap. Free for a public repository.
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      send:
        description: "Send alerts to LINE"
        type: boolean
        default: false

permissions:
  contents: write

# Own lock: one run at a time, one waiting (a newer waiting run replaces an older one). Never cancels
# the morning or weekly jobs. signals.json is left to the morning job between 07:00 and 07:30 Thai time.
concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEND: ${{ github.event_name == 'schedule' || inputs.send }}
      RECORD: "true"
      STATE_DIR: state
      SPREAD_USD: ${{ vars.SPREAD_USD || '0.4' }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      # Web push to the app (scripts/push.js) — skipped while these are empty
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      SITE_URL: https://gold-signal-ten.vercel.app
    steps:
      - uses: actions/checkout@v4
      # What was already announced (✅ updates, news warnings, failure notices) — restored first so
      # the failure notice can throttle itself even when an early step fails
      - name: Restore notify state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: notify-${{ github.run_id }}
          restore-keys: notify-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web-push
        run: npm install --omit=dev --no-audit --no-fund --no-package-lock
      - run: pip install -r requirements.txt
      - name: Check every 5 minutes (alerts, 30-minute signals, ✅ updates, news warnings)
        # Each check queues its LINE messages in OUTBOX and sends them as ONE request (flush.js),
        # then commits signals.json / intraday.json
        env:
          OUTBOX: outbox.json
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '28' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-loop.sh
      - name: Tell the owner if this failed
        if: failure()
        run: node scripts/notify-failure.js "เช็กราคา / สัญญาณ 30 นาที (ทุก 5 นาที)"
        env:
          SEND: "true"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Save notify state
        if: always() && hashFiles('state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: notify-${{ github.run_id }}-${{ github.run_attempt }}

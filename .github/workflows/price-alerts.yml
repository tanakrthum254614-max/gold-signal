name: Signal recorder (every 5 minutes)

on:
  # Mon–Fri (UTC) = Mon 07:00 – Sat 06:59 Thai time. GitHub starts scheduled runs late and irregularly
  # (often 10–20 minutes apart), so each run stays up ~28 minutes and checks at every 5-minute mark
  # itself (scripts/check-loop.sh). A run is queued every 15 minutes: the next one starts as soon as the
  # current one ends, so there is no gap. Free for a public repository.
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      chain:
        description: "Chained run (queued by the previous run): full 28-minute loop"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # queue the next run (chain)

# Own lock: one run at a time, one waiting (a newer waiting run replaces an older one). Never cancels
# the morning or weekly jobs. signals.json is left to the morning job between 07:00 and 07:30 Thai time.
concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RECORD: "true"
      STATE_DIR: state
      SPREAD_USD: ${{ vars.SPREAD_USD || '0.4' }}
      SITE_URL: https://gold-signal.gold-signal.workers.dev
    steps:
      - uses: actions/checkout@v4
      # Real time with no gaps (19 Oct 2026, user: "ขอแบบเรียลไทม์ทุกอย่าง"): cron runs started 15–40 minutes apart, so
      # nothing was checked between them. Each looping run now queues the next one right away (concurrency keeps it
      # waiting until this one ends). Mon–Fri UTC only, like the cron; the cron stays as the backup that restarts the chain.
      - name: Queue the next run
        if: github.event_name == 'schedule' || inputs.chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%u)" -le 5 ] && gh workflow run price-alerts.yml --ref "${{ github.ref_name }}" -f chain=true || echo "weekend: chain stops"
      # State kept between runs (STATE_DIR)
      - name: Restore notify state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: notify-${{ github.run_id }}
          restore-keys: notify-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Check every 5 minutes and record the signals (11 Nov 2026: no LINE / push any more)
        env:
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.chain) && '28' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-loop.sh
      - name: Save notify state
        if: always() && hashFiles('state/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: notify-${{ github.run_id }}-${{ github.run_attempt }}

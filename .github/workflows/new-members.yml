name: New member alerts

# Every 15 minutes, every day: sends the "new member" messages queued by middleware.js to the admins
# (scripts/new-members.js). Free for a public repository; a run with nobody new takes a few seconds.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: new-members
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEND: "true"
      SITE_URL: https://gold-signal-ten.vercel.app
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      # The owner's LINE user ID (LINE Developers → the Messaging API channel → Basic settings → "Your user ID").
      # Empty = push notifications only.
      LINE_OWNER_ID: ${{ secrets.LINE_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev --no-audit --no-fund --no-package-lock
      - run: node scripts/new-members.js

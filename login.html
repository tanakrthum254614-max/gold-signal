<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gold Signal · เข้าสู่ระบบ</title>
  <meta name="theme-color" content="#f3f5f9">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f3f5f9; --text: #1c2433; --muted: #697386; --down: #e0424f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1016; --text: #e6e9ef; --muted: #8a93a3; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: "IBM Plex Sans Thai", system-ui, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 440px; display: grid; justify-items: center; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 52px; height: 52px; }
    .brand b { font-size: 26px; }
    .lead { margin: 0; color: var(--muted); font-size: 14.5px; text-align: center; }
    #status { color: var(--muted); font-size: 15px; min-height: 1.5em; text-align: center; }
    #status.err { color: var(--down); }
    #signIn { width: 100%; display: flex; justify-content: center; }
    .privacy { margin: 0; max-width: 400px; color: var(--muted); font-size: 12.5px; text-align: center; }
    .privacy a { color: inherit; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 400px; padding: 5px; border-radius: 14px; background: rgba(105,115,134,.14); }
    .tabs button { font: inherit; font-weight: 700; font-size: 15px; padding: 10px; border: 0; border-radius: 10px; cursor: pointer; background: transparent; color: var(--muted); }
    .tabs button.on { background: #fff; color: #1c2433; box-shadow: 0 2px 8px rgba(20,30,50,.12); }
    .tabs[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="logo.svg" alt=""><b>Gold Signal</b></div>
    <p class="lead">🔒 สำหรับสมาชิกเท่านั้น — ยังไม่มีบัญชี กดแท็บ <b>“สมัครสมาชิก”</b> (ฟรี ใช้อีเมลหรือ Google)</p>
    <div class="tabs" id="tabs" hidden><button type="button" class="on" data-mode="in">เข้าสู่ระบบ</button><button type="button" data-mode="up">สมัครสมาชิก</button></div>
    <p id="status">กำลังโหลด…</p>
    <div id="signIn"></div>
    <p class="privacy">การสมัครและเข้าใช้งาน ถือว่ายอมรับการเก็บอีเมล บันทึกการเข้าใช้ (เวลา อุปกรณ์ เมืองโดยประมาณ) เพื่อดูแลระบบ · <a href="/privacy.html">นโยบายความเป็นส่วนตัว</a></p>
  </main>
  <script>
    // Members only: sign up / sign in with Clerk (email + password with an emailed code, or Google). Once signed in, the
    // Clerk session token goes to /api/session (middleware.js checks it and sets the site's own cookie) → the app.
    const PK = 'pk_test_ZGVsaWNhdGUtdGFwaXItMjEwMS5jbGVyay5hY2NvdW50cy5kZXYk'; // public by design
    const FAPI = atob(PK.split('_')[2]).replace(/\$$/, '');
    const $ = (id) => document.getElementById(id);
    const status = (text, err) => { $('status').textContent = text; $('status').className = err ? 'err' : ''; };

    const THEME = {
      variables: {
        colorPrimary: '#1c2433', colorPrimaryForeground: '#ffffff', colorTextOnPrimaryBackground: '#ffffff',
        colorBackground: '#ffffff', colorForeground: '#1c2433', colorText: '#1c2433',
        colorMutedForeground: '#697386', colorTextSecondary: '#697386', colorNeutral: '#1c2433',
        colorInput: '#f2f5f9', colorInputBackground: '#f2f5f9', colorInputForeground: '#1c2433', colorInputText: '#1c2433',
        fontFamily: '"IBM Plex Sans Thai", system-ui, sans-serif', borderRadius: '10px', fontSize: '16px',
      },
      elements: {
        socialButtonsBlockButton: { padding: '12px', fontSize: '15px' },
        cardBox: { boxShadow: '0 8px 24px rgba(20,30,50,.08)', border: '1px solid #e2e7ef', borderRadius: '20px' },
      },
    };
    const THAI = {
      signIn: { start: {
        title: 'เข้าสู่ระบบ Gold Signal', subtitle: 'ใช้อีเมลหรือบัญชี Google ที่สมัครไว้',
        titleCombined: 'เข้าสู่ระบบ Gold Signal', subtitleCombined: 'ใช้อีเมลหรือบัญชี Google ที่สมัครไว้',
      } },
      signUp: { start: { title: 'สมัครสมาชิก Gold Signal', subtitle: 'สมัครฟรีด้วยอีเมล หรือกดปุ่ม Google' } },
    };
    function merge(base, extra) {
      const out = { ...base };
      for (const [k, v] of Object.entries(extra)) out[k] = v && typeof v === 'object' && !Array.isArray(v) ? merge(base[k] || {}, v) : v;
      return out;
    }
    function loadScript(src, attrs = {}) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.crossOrigin = 'anonymous';
        Object.entries(attrs).forEach(([k, v]) => s.setAttribute(k, v));
        s.onload = resolve; s.onerror = () => reject(new Error('โหลดระบบเข้าสู่ระบบไม่สำเร็จ'));
        document.head.appendChild(s);
      });
    }

    let entering = false;
    async function enter() {
      if (entering) return;
      entering = true;
      status('เข้าสู่ระบบสำเร็จ กำลังเปิดเว็บ…');
      try {
        const token = await window.Clerk.session.getToken();
        const r = await fetch('/api/session', { method: 'POST', headers: { authorization: `Bearer ${token}` } });
        if (r.ok) { location.replace('/'); return; }
        if (r.status === 403) { await window.Clerk.signOut().catch(() => {}); status('⛔ บัญชีนี้ถูกระงับการใช้งาน — ติดต่อผู้ดูแลที่ tanakrthum254614@gmail.com', true); return; }
        status('ยืนยันบัญชีไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง', true);
      } catch (e) { status('เชื่อมต่อไม่ได้ ลองรีเฟรชหน้าอีกครั้ง', true); }
      entering = false;
    }

    (async () => {
      let thTH = {};
      await Promise.all([
        loadScript(`https://${FAPI}/npm/@clerk/ui@1/dist/ui.browser.js`),
        loadScript(`https://${FAPI}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, { 'data-clerk-publishable-key': PK }),
        import('https://cdn.jsdelivr.net/npm/@clerk/localizations@4/+esm').then((m) => { thTH = m.thTH; }).catch(() => {}),
      ]);
      const Clerk = window.Clerk;
      await Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor }, localization: merge(thTH, THAI), appearance: THEME });
      // Coming from "ออกจากระบบ" in the app: end the Clerk session too
      if (new URLSearchParams(location.search).has('signout') && Clerk.user) {
        await Clerk.signOut();
        history.replaceState(null, '', '/login.html');
      }
      if (new URLSearchParams(location.search).has('banned')) {
        if (Clerk.user) await Clerk.signOut();
        history.replaceState(null, '', '/login.html');
        status('⛔ บัญชีนี้ถูกระงับการใช้งาน — ติดต่อผู้ดูแลที่ tanakrthum254614@gmail.com', true);
        return;
      }
      if (Clerk.user) return enter();
      status('');
      // Two clear tabs: sign in | sign up (Clerk's combined screen has no visible "sign up" link)
      const opts = { forceRedirectUrl: '/login.html', signUpForceRedirectUrl: '/login.html', signInForceRedirectUrl: '/login.html' };
      let mode = '';
      const show = (m) => {
        if (m === mode) return;
        if (mode === 'in') Clerk.unmountSignIn($('signIn')); else if (mode === 'up') Clerk.unmountSignUp($('signIn'));
        mode = m;
        document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
        if (m === 'in') Clerk.mountSignIn($('signIn'), { ...opts, withSignUp: true }); else Clerk.mountSignUp($('signIn'), opts);
      };
      $('tabs').hidden = false;
      $('tabs').addEventListener('click', (e) => e.target.dataset.mode && show(e.target.dataset.mode));
      show(location.hash === '#signup' ? 'up' : 'in');
      Clerk.addListener(({ user }) => { if (user) enter(); });
    })().catch((e) => { console.error(e); status(e.message || 'ระบบเข้าสู่ระบบมีปัญหา ลองรีเฟรชหน้าอีกครั้ง', true); });
  </script>
</body>
</html>

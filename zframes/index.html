<body>
<header class="top">
  <a class="back" href="/#home">← Gold Signal</a><span class="brand">ZFrames</span>
  <select id="pick" aria-label="เลือก dashboard"></select>
  <span id="ver" class="muted"></span>
  <span id="livebadge" class="livebadge off"><i></i>กำลังเชื่อมต่อ…</span>
  <span id="stamp" class="muted right"></span>
</header>
<main id="app"><p class="muted pad">กำลังโหลด…</p></main>
<footer id="ticker" class="ticker"></footer>
<script>
  document.querySelector('.back').addEventListener('click', () => {
    try { sessionStorage.setItem('gs-skip-splash-once', '1'); } catch (e) {}
  });
  // แสดงข้อผิดพลาดบนหน้า (ช่วยตรวจเมื่อหน้าค้างที่ "กำลังโหลด")
  const showErr = t => document.body.insertAdjacentHTML('afterbegin', `<pre style="background:#7f1d1d;color:#fff;padding:8px;margin:0;white-space:pre-wrap;font-size:12px">${String(t).replace(/</g, '&lt;')}</pre>`);
  window.onerror = (m, s, l, c, e) => showErr(`${m} @ ${s}:${l}:${c}\n${e?.stack || ''}`);
  window.onunhandledrejection = e => showErr('Promise: ' + (e.reason?.stack || e.reason));
</script>
